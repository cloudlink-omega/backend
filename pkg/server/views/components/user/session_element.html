{{ define "user_session_element" }}
<tr class="border-b hover:bg-gray-100 dark:hover:bg-gray-700">
    <td class="px-4 py-2">{{ .UserAgent }}</td>
    <td class="px-4 py-2">{{ .Origin }}</td>
    <td class="px-4 py-2">{{ .IP }}</td>
    <td class="px-4 py-2">{{ .CreatedAt }}</td>
    <td class="px-4 py-2">{{ .ExpiresAt }}</td>
</tr>
{{ end }}
