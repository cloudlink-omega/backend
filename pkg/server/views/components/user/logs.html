{{ define "user_logs" }}
<div class="bg-white dark:bg-gray-800 p-4 rounded shadow mt-2 mb-6">
    <h2 class="text-xl font-semibold text-gray-700 dark:text-white mb-4">Account Log</h2>
    {{ if .Empty }}
        <p class="text-gray-600 dark:text-white mb-4">Nothing to see here...</p>
    {{ else }}
    <p class="text-gray-600 dark:text-white mb-4">Showing page {{ .Page }} of {{ .Pages }}</p>
    <table class="w-full text-left">
        <tr class="border-b">
            <th class="px-4 py-2 text-gray-600 dark:text-white font-semibold">Timestamp</th>
            <th class="px-4 py-2 text-gray-600 dark:text-white font-semibold">Action</th>
            <th class="px-4 py-2 text-gray-600 dark:text-white font-semibold">Status</th>
            <th class="px-4 py-2 text-gray-600 dark:text-white font-semibold">Details</th>
        </tr>
        {{ range .Logs }}
            {{ template "user_log_element" . }}
        {{ end }}
    </table>
    {{ end }}
</div>
{{ end }}
